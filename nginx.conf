server {
    listen 80;
    server_name _;

    # Без этого nginx резолвит remnawave_bot при старте — в сети cabinet_default контейнер не поднимется.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # Прямой доступ к кабинету по порту (dev). В production /api режет внешний nginx на remnawave_bot.
    location ~ ^/api/(.*)$ {
        set $bot_upstream remnawave_bot;
        proxy_pass http://$bot_upstream:8080/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: кэширование статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
